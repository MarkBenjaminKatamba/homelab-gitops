apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulungi-website
  labels:
    app.kubernetes.io/name: bulungi-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bulungi-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulungi-website
    spec:
      containers:
        - name: bulungi-website
          image: ghcr.io/MarkBenjaminKatamba/bulungi-website:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 200m
              memory: 256Mi


